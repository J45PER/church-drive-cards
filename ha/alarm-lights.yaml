# Automation 'Church Drive: alarm lights': a copy of the automation (not installed live until the user says so).
alias: 'Church Drive: alarm lights'
description: >-
  What the lights do when an alarm goes off, with a different answer for each kind. FIRE, SMOKE, HEAT or CARBON MONOXIDE (the same five
  sensors as 'Church Drive: safety alarms'): every light comes on at full brightness, steady cool white, so everyone can see the way out, and
  stays on. THE HOUSE (SECURITY) ALARM going off (alarm_control_panel.church_drive_alarm is 'triggered'): every light comes on full, then the
  room and zone groups flash red and white every 3 seconds until the alarm is turned off. Fire wins: if a smoke, heat or CO alarm goes off while
  the house alarm is flashing, the flashing stops and the lights go steady white. When the last alarm stops, every light goes back to how it was
  before the first one went off (saved in scene.church_drive_before_alarm). Turn this automation off in Settings > Automations to stop it
  touching the lights.
triggers:
- trigger: state
  entity_id:
  - binary_sensor.entrance_smoke_alarm_alarm_status
  - binary_sensor.middle_floor_smoke_alarm_alarm_status
  - binary_sensor.top_floor_smoke_alarm_alarm_status
  - binary_sensor.kitchen_heat_alarm_alarm_status
  - binary_sensor.carbon_monoxide_alarm_alarm_status
  to: 'on'
  not_from:
  - unavailable
  - unknown
  id: safety_on
- trigger: state
  entity_id: alarm_control_panel.church_drive_alarm
  to: triggered
  not_from:
  - unavailable
  - unknown
  id: house_on
- trigger: state
  entity_id:
  - binary_sensor.entrance_smoke_alarm_alarm_status
  - binary_sensor.middle_floor_smoke_alarm_alarm_status
  - binary_sensor.top_floor_smoke_alarm_alarm_status
  - binary_sensor.kitchen_heat_alarm_alarm_status
  - binary_sensor.carbon_monoxide_alarm_alarm_status
  from: 'on'
  to: 'off'
  id: safety_off
- trigger: state
  entity_id: alarm_control_panel.church_drive_alarm
  from: triggered
  not_to:
  - unavailable
  - unknown
  id: house_off
conditions: []
actions:
- alias: Work out what is going off
  variables:
    safety_on: "{{ ['binary_sensor.entrance_smoke_alarm_alarm_status', 'binary_sensor.middle_floor_smoke_alarm_alarm_status', 'binary_sensor.top_floor_smoke_alarm_alarm_status',
      'binary_sensor.kitchen_heat_alarm_alarm_status', 'binary_sensor.carbon_monoxide_alarm_alarm_status'] | select('is_state', 'on') | list | count }}"
    house_on: "{{ is_state('alarm_control_panel.church_drive_alarm', 'triggered') }}"
    lights: "{{ states.light | rejectattr('attributes.entity_id', 'defined') | rejectattr('entity_id', 'search', 'backlight') | map(attribute='entity_id') | list }}"
    groups: "{{ states.light | selectattr('attributes.entity_id', 'defined') | map(attribute='entity_id') | list }}"
- choose:
  - alias: The last alarm has stopped, so put the lights back
    conditions:
    - condition: trigger
      id:
      - safety_off
      - house_off
    - condition: template
      value_template: "{{ safety_on | int(0) == 0 and not house_on }}"
    - condition: template
      value_template: "{{ states.scene | selectattr('entity_id', 'eq', 'scene.church_drive_before_alarm') | list | count > 0 }}"
    sequence:
    - action: scene.turn_on
      target:
        entity_id: scene.church_drive_before_alarm
      data:
        transition: 2
  - alias: Fire, smoke, heat or carbon monoxide, steady cool white at full
    conditions:
    - condition: trigger
      id: safety_on
    sequence:
    - alias: Remember how the lights were (not if another alarm already changed them)
      if:
      - condition: template
        value_template: "{{ safety_on | int(0) <= 1 and not house_on }}"
      then:
      - action: scene.create
        data:
          scene_id: church_drive_before_alarm
          snapshot_entities: "{{ lights }}"
    - action: light.turn_on
      target:
        entity_id: "{{ lights }}"
      data:
        brightness_pct: 100
        color_temp_kelvin: 4000
        transition: 0
  - alias: House alarm, full brightness then flashing red and white
    conditions:
    - condition: trigger
      id:
      - house_on
      - safety_off
    - condition: template
      value_template: "{{ house_on and safety_on | int(0) == 0 }}"
    sequence:
    - alias: Remember how the lights were (not if another alarm already changed them)
      if:
      - condition: trigger
        id: house_on
      then:
      - action: scene.create
        data:
          scene_id: church_drive_before_alarm
          snapshot_entities: "{{ lights }}"
    - action: light.turn_on
      target:
        entity_id: "{{ lights }}"
      data:
        brightness_pct: 100
        color_temp_kelvin: 4000
        transition: 0
    - alias: Flash red and white until the alarm is turned off
      repeat:
        while:
        - condition: state
          entity_id: alarm_control_panel.church_drive_alarm
          state: triggered
        sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ groups }}"
          data:
            brightness_pct: 100
            rgb_color:
            - 255
            - 0
            - 0
            transition: 0
        - delay:
            seconds: 3
        - action: light.turn_on
          target:
            entity_id: "{{ groups }}"
          data:
            brightness_pct: 100
            color_temp_kelvin: 4000
            transition: 0
        - delay:
            seconds: 3
mode: restart
max_exceeded: silent
