# Script script.clive_climate_zone: Clive looks after one heating zone: the automatic on and off. Run every 10 minutes for each zone by the automation "Clive: keep the climate comfortable", straight away by "Clive: spot a manual heating change" when somebody changes the thermostat, and at the end of a pause by "Clive: take over again when a pause ends". Not exposed to Assist (clive_climate_control is the one Clive uses). dry_run only reports what it would do. A copy of the live script.
#
# Clive only adjusts the target temperature of a zone that is already heating (mode heat, preset none), and only while he is in charge (not paused, zone switch on). He never turns the heating on or to eco himself, so what a person has switched off stays off. The one thing he does by himself is turn it OFF when the alarm is armed away (nobody home, decision away_off): not within a pause (a person set it) or a timed run, otherwise whatever the cooldown. A person asking for on/off/temperature goes through clive_climate_control.
# Comfort ranges are input_number.clive_climate_<zone>_low and _high (set in the app, a thermostat's settings sheet; started at downstairs 18 to 21, upstairs 15 to 19; the numbers in `zones` below are only the fallback). He is slow to act: the room must be more than 1.5 degrees below the bottom of the range (downstairs below 16.5, upstairs below 13.5) and the target less than 1 degree above the room, and then the target is raised to the middle of the range. He lowers the target to the middle of the range only when the room is 1 degree or more above the top (downstairs 22, upstairs 20) and it is heating or the target is above the range. If cooling is ever added to this script it follows the same rule: nothing until 1 degree above the top of the range.
# At least 30 minutes between Clive's own changes. Only a raised target pushes a notification, at most one per zone every 2 hours (input_datetime.clive_climate_<zone>_notified); lowering is silent. Both are in the logbook. A pause, and the end of one, always tell people. Skipped while a timed run (clive_timed_control) is going on that zone and for 3 minutes after it.
# Each zone has its own switch, input_boolean.clive_climate_<zone>_auto (Clive controlled when on, Manual when off, set in the app's Settings): with it off the script decides skip_disabled, spots no manual changes and starts no pauses.
#
# A change made by somebody else pauses Clive on that zone: one reported by_hand (a change to the mode, preset or target that did not come from a Home Assistant script or automation) more than 3 minutes after Clive's own last action (a Nest takes up to a minute to echo and moves its own target when it leaves eco), or, found by the 10 minute check, a mode or preset that is not what Clive last set (or the target after a "lower"). The pause lasts input_number.clive_climate_pause_minutes. input_datetime.clive_climate_<zone>_resume holds when he takes over again; in the past (and not 2000) means a pause has just ended. While paused he does nothing.
# The helpers: _note is what he last did, in words; _expect is what he last set, as JSON {m, p, t, hot}; _when is when he last acted; _resume is the end of a pause.
alias: Look after one heating zone
description: 'Started by the automations Clive: keep the climate comfortable, Clive: spot a manual heating change and Clive: take over again when a pause ends. Not for Clive to call.'
fields:
  zone:
    name: Zone
    required: true
    selector:
      select:
        custom_value: false
        options:
        - downstairs
        - upstairs
  by_hand:
    name: Changed by hand
    description: Set by the automation that spotted a thermostat change that did not come from Home Assistant's own scripts or automations.
    required: false
    selector:
      boolean: {}
  dry_run:
    name: Only report
    description: Change nothing, say what would be done.
    required: false
    selector:
      boolean: {}
  pretend_temperature:
    name: Pretend temperature
    description: 'For testing, use this instead of the sensor.'
    required: false
    selector:
      number:
        min: -10
        max: 45
        step: 0.1
        mode: box
icon: mdi:home-thermometer-outline
mode: queued
max: 6
sequence:
- variables:
    zones:
      downstairs:
        entity: climate.downstairs
        temp: sensor.downstairs_temperature
        timer: timer.clive_heating_downstairs
        note: input_text.clive_climate_downstairs_note
        expect: input_text.clive_climate_downstairs_expect
        when: input_datetime.clive_climate_downstairs_when
        resume: input_datetime.clive_climate_downstairs_resume
        notified: input_datetime.clive_climate_downstairs_notified
        low: 18
        high: 21
        auto: input_boolean.clive_climate_downstairs_auto
        name: Downstairs
        room: the living room
      upstairs:
        entity: climate.upstairs
        temp: sensor.upstairs_temperature
        timer: timer.clive_heating_upstairs
        note: input_text.clive_climate_upstairs_note
        expect: input_text.clive_climate_upstairs_expect
        when: input_datetime.clive_climate_upstairs_when
        resume: input_datetime.clive_climate_upstairs_resume
        notified: input_datetime.clive_climate_upstairs_notified
        low: 15
        high: 19
        auto: input_boolean.clive_climate_upstairs_auto
        name: Upstairs
        room: upstairs
- variables:
    z: '{{ dict(zones[zone], low=states(''input_number.clive_climate_'' ~ zone ~ ''_low'') | float(zones[zone].low), high=states(''input_number.clive_climate_'' ~ zone ~ ''_high'') | float(zones[zone].high)) }}'
    dry: '{{ dry_run | default(false) | bool(false) }}'
    hand: '{{ by_hand | default(false) | bool(false) }}'
- variables:
    temp: '{{ pretend_temperature | float(none) if pretend_temperature is defined and pretend_temperature is not none else states(z.temp) | float(none) }}'
    mode: '{{ states(z.entity) }}'
    preset: '{{ state_attr(z.entity, ''preset_mode'') }}'
    setpoint: '{{ state_attr(z.entity, ''temperature'') | float(none) }}'
    hvac_action: '{{ state_attr(z.entity, ''hvac_action'') }}'
    timer_state: '{{ states(z.timer) }}'
    timer_age: '{{ (now().timestamp() - as_timestamp(states[z.timer].last_changed, 0)) / 60 }}'
    expect: '{{ states(z.expect) if states(z.expect) not in [''unknown'', ''unavailable''] else '''' }}'
    when_age: '{{ (now().timestamp() - (state_attr(z.when, ''timestamp'') | float(0))) / 60 }}'
    resume_at: '{{ state_attr(z.resume, ''timestamp'') | float(0) }}'
    pause_min: '{{ states(''input_number.clive_climate_pause_minutes'') | float(120) }}'
    mid: '{{ (z.low + z.high) / 2 }}'
- variables:
    exp: '{{ expect | from_json(default={}) if expect != '''' else {} }}'
    over: '{{ (temp - z.high) if temp is not none else 0 }}'
    unavailable: '{{ temp is none or mode in [''unavailable'', ''unknown''] }}'
    auto_off: "{{ is_state(z.auto, 'off') }}"
    timed: '{{ timer_state != ''idle'' or timer_age < 3 }}'
    resume_due: '{{ resume_at > 946684801 and resume_at <= now().timestamp() }}'
    paused: '{{ resume_at > now().timestamp() }}'
    away: "{{ is_state('alarm_control_panel.church_drive_alarm', 'armed_away') }}"
- variables:
    exp_eff: '{{ {} if resume_due else exp }}'
    when_age_eff: '{{ 9999 if resume_due else when_age }}'
- variables:
    sig_changed: '{{ (exp_eff | length > 0) and (mode != exp_eff.m or preset != exp_eff.p or (exp_eff.t is not none and setpoint is not none and (setpoint - exp_eff.t) | abs > 0.3)) }}'
    held_hot: '{{ exp_eff.hot is defined and exp_eff.hot }}'
    tier: >-
      {%- if over >= 1 -%}lower{%- else -%}none{%- endif -%}
- variables:
    manual: '{{ not auto_off and not paused and not unavailable and not timed and when_age_eff >= 3 and (sig_changed or hand) }}'
    needs_heat: "{{ mode == 'heat' and preset == 'none' and temp < z.low - 1.5 and setpoint is not none and setpoint < temp + 1 }}"
- variables:
    decision: >-
      {%- if unavailable -%}skip_unavailable
      {%- elif auto_off -%}skip_disabled
      {%- elif timed -%}skip_timed_run
      {%- elif paused -%}skip_paused
      {%- elif manual -%}pause
      {%- elif away and mode != 'off' -%}away_off
      {%- elif when_age_eff < 30 -%}skip_cooldown
      {%- elif needs_heat -%}heat_on
      {%- elif tier != 'none' and mode == 'heat' and preset == 'none' and setpoint is not none and setpoint > mid and (hvac_action == 'heating' or setpoint > z.high) -%}lower
      {%- else -%}ok
      {%- endif -%}
    resume_at_text: '{{ (now().timestamp() + pause_min * 60) | timestamp_custom(''%H:%M'') }}'
- variables:
    report:
      zone: '{{ zone }}'
      decision: '{{ decision }}'
      temperature: '{{ temp }}'
      comfort_low: '{{ z.low }}'
      comfort_high: '{{ z.high }}'
      mode: '{{ mode }}'
      preset: '{{ preset }}'
      target: '{{ setpoint }}'
      paused_until: '{{ (resume_at | timestamp_custom(''%H:%M'')) if paused else none }}'
      pause_just_ended: '{{ resume_due }}'
      last_action: '{{ states(z.note) }}'
- if:
  - condition: template
    value_template: '{{ dry }}'
  then:
  - response_variable: report
    stop: dry run
- if:
  - condition: template
    value_template: '{{ resume_due and not unavailable and not auto_off }}'
  then:
  - action: input_text.set_value
    target:
      entity_id: '{{ z.note }}'
    data:
      value: ''
  - action: input_text.set_value
    target:
      entity_id: '{{ z.expect }}'
    data:
      value: ''
  - action: input_datetime.set_datetime
    target:
      entity_id: '{{ z.resume }}'
    data:
      datetime: '2000-01-01 00:00:00'
  - action: input_datetime.set_datetime
    target:
      entity_id: '{{ z.when }}'
    data:
      datetime: '2000-01-01 00:00:00'
  - action: persistent_notification.dismiss
    data:
      notification_id: clive-climate-{{ zone }}
  - action: church_drive.notify
    data:
      kind: clive_actions
      title: 🌡️ Clive is back in charge of {{ z.name }}
      message: '{{ z.name }} heating is on automatic again. Clive keeps {{ z.room }} between {{ z.low }}°C and {{ z.high }}°C.'
      tag: church-drive-clive-climate-{{ zone }}
      link: /dashboard-mobile/climate
  - action: logbook.log
    data:
      name: Clive
      message: '{{ z.name }} heating is back on automatic.'
      entity_id: '{{ z.entity }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ decision == ''away_off'' }}'
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: '{{ z.entity }}'
      data:
        hvac_mode: 'off'
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ z.when }}'
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ z.expect }}'
      data:
        value: '{{ {''m'': ''off'', ''p'': preset, ''t'': none, ''hot'': false, ''away'': true, ''prev'': setpoint} | tojson }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ z.note }}'
      data:
        value: '{{ now().strftime(''%H:%M'') }}: Turned {{ z.name }} heating off because the alarm is set to away. It stays off until somebody asks Clive to take over again.'
    - action: church_drive.notify
      data:
        kind: clive_actions
        title: 🌡️ {{ z.name }} heating turned off
        message: 'The alarm is set to away, so nobody needs the heating. Clive turned the {{ z.name }} heating off. It stays off until somebody asks Clive to take over again.'
        tag: church-drive-clive-away-{{ zone }}
        link: /dashboard-mobile/climate
    - action: logbook.log
      data:
        name: Clive
        message: '{{ z.name }} heating turned off: the alarm is set to away.'
        entity_id: '{{ z.entity }}'
  - conditions:
    - condition: template
      value_template: '{{ decision == ''pause'' }}'
    sequence:
    - variables:
        shown: >-
          {%- if mode == 'off' -%}off
          {%- elif preset == 'eco' -%}eco
          {%- elif setpoint is not none -%}heat to {{ setpoint }}°C
          {%- else -%}heat
          {%- endif -%}
        until: '{{ (now() + timedelta(minutes=pause_min)).strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ z.resume }}'
      data:
        datetime: '{{ until }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ z.when }}'
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ z.expect }}'
      data:
        value: '{{ {''m'': mode, ''p'': preset, ''t'': setpoint, ''hot'': false} | tojson }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ z.note }}'
      data:
        value: '{{ now().strftime(''%H:%M'') }}: {{ z.name }} was set by hand ({{ shown }}). Paused until {{ resume_at_text }}.'
    - action: persistent_notification.create
      data:
        notification_id: clive-climate-{{ zone }}
        title: 🌡️ {{ z.name }} heating set by hand
        message: >-
          {{ z.name }} heating was changed to {{ shown }}. Clive has stopped adjusting it and will take over again at {{ resume_at_text }}
          ({{ pause_min | int }} minutes). To hand it back sooner, tell Clive "resume the heating" or run the script "Pause or resume Clive's heating".
    - action: church_drive.notify
      data:
        kind: clive_actions
        title: 🌡️ {{ z.name }} heating set by hand
        message: '{{ z.name }} heating was changed to {{ shown }}. Clive has stopped adjusting it and will take over again at {{ resume_at_text }} ({{ pause_min | int }} minutes).'
        tag: church-drive-clive-paused-{{ zone }}
        link: /dashboard-mobile/climate
    - action: logbook.log
      data:
        name: Clive
        message: '{{ z.name }} heating was set by hand ({{ shown }}), so Clive is paused until {{ resume_at_text }}.'
        entity_id: '{{ z.entity }}'
  - conditions:
    - condition: template
      value_template: '{{ decision in [''heat_on'', ''lower''] }}'
    sequence:
    - variables:
        did: >-
          {%- if decision == 'heat_on' -%}raised the heating to {{ mid }}°C
          {%- else -%}lowered the heating to {{ mid }}°C
          {%- endif -%}
        push: '{{ decision == ''heat_on'' and ((now().timestamp() - (state_attr(z.notified, ''timestamp'') | float(0))) / 60) >= 120 }}'
        why: >-
          {%- if decision == 'heat_on' -%}{{ z.room }} was down to {{ temp }}°C (comfortable from {{ z.low }}°C)
          {%- else -%}{{ z.room }} reached {{ temp }}°C (comfortable up to {{ z.high }}°C)
          {%- endif -%}
    - action: input_datetime.set_datetime
      target:
        entity_id: '{{ z.when }}'
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ z.expect }}'
      data:
        value: >-
          {{ {'m': 'off' if decision == 'off' else 'heat' if decision == 'heat_on' else mode,
              'p': 'eco' if decision == 'eco' else 'none' if decision == 'heat_on' else preset,
              't': mid if decision == 'lower' else none,
              'hot': decision != 'heat_on'} | tojson }}
    - action: input_text.set_value
      target:
        entity_id: '{{ z.note }}'
      data:
        value: '{{ now().strftime(''%H:%M'') }}: {{ did | capitalize }} because {{ why }}.'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ decision == ''heat_on'' }}'
        sequence:
        - action: climate.set_temperature
          target:
            entity_id: '{{ z.entity }}'
          data:
            temperature: '{{ mid }}'
      default:
      - action: climate.set_temperature
        target:
          entity_id: '{{ z.entity }}'
        data:
          temperature: '{{ mid }}'
    - if:
      - condition: template
        value_template: '{{ push }}'
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id: '{{ z.notified }}'
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: church_drive.notify
        data:
          kind: clive_actions
          title: '🌡️ {{ z.name }} heating target raised'
          message: '{{ why | capitalize }}, so Clive {{ did }}.'
          tag: church-drive-clive-climate-{{ zone }}
          link: /dashboard-mobile/climate
    - action: logbook.log
      data:
        name: Clive
        message: '{{ z.name }} heating: {{ did }} (room {{ temp }}°C).'
        entity_id: '{{ z.entity }}'
- variables:
    report: '{{ dict(report, decision=decision, acted=decision in [''pause'', ''away_off'', ''heat_on'', ''lower''] or (resume_due and not auto_off)) }}'
- response_variable: report
  stop: done
