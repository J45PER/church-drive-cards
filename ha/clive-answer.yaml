# Script script.clive_answer: The house format for any answer that came from a web search or that is a how-to, advice or the news. Exposed to Assist. Clive gives the single most useful part and a short offer of more; the script keeps only the first sentence (or, for a bigger question, the first two if they are 40 words or fewer), makes sure the offer ends with a question mark, shows a link or picture on the screen if one was found (through clive_show), writes Diane as Die Ann for the voice, and returns `say`: the exact words to speak. A model that ignores a rule about length cannot ignore this. Simple facts Clive already knows are answered directly instead, because a script call would only make them slower. A copy of the live script.
alias: Give an answer
description: 'Use this for ANY answer that came from a web search, and for any how-to, advice or news question. Call this to give the answer. answer is the single most useful part (one or two short sentences, never every step). offer is a short offer of more that fits the topic and ends with a question mark, for example "Shall I take you through the rest of the steps?". size is simple (the default) or bigger for how-to, advice and news. If you found a real https page or picture give link_url, link_label (two to four words) or image_url and it is shown on the screen. It returns the words to say: your whole reply must be exactly the text in "say", nothing before or after it. If they say yes to the offer, give the next most useful part the same way.'
fields:
  answer:
    name: Answer
    required: true
    selector:
      text:
        multiline: true
  offer:
    name: Offer of more
    required: false
    selector:
      text: {}
  size:
    name: Size
    required: false
    selector:
      select:
        custom_value: false
        options:
        - simple
        - bigger
  link_url:
    name: Link
    required: false
    selector:
      text: {}
  link_label:
    name: Link label
    required: false
    selector:
      text: {}
  image_url:
    name: Picture
    required: false
    selector:
      text: {}
icon: mdi:message-text-fast-outline
mode: parallel
max: 5
sequence:
- variables:
    sentences: '{{ (answer | string | trim) | regex_findall(''.+?[.!?]+(?=\s|$)'') }}'
- variables:
    first: '{{ (sentences[0] if sentences | length > 0 else (answer | string | trim)) | trim }}'
    both: '{{ (sentences[:2] | map(''trim'') | join('' '')) if sentences | length > 0 else (answer | string | trim) }}'
    extra: '{{ (offer | default('''', true) | string | trim) }}'
- variables:
    body: '{{ both if (size | default(''simple'', true)) == ''bigger'' and (both | wordcount) <= 40 else first }}'
    ask: >-
      {{ (extra ~ ('' if extra.endswith('?') else '?')) if extra else 'Do you want to know more?' }}
- variables:
    say: '{{ ((body ~ '' '' ~ ask) | replace(''Diane'', ''Die Ann'')) }}'
- if:
  - condition: template
    value_template: '{{ (link_url | default('''') | string).startswith(''https://'') or (image_url | default('''') | string).startswith(''https://'') }}'
  then:
  - action: script.clive_show
    continue_on_error: true
    data:
      link_url: '{{ link_url | default('''') }}'
      link_label: '{{ link_label | default('''') }}'
      image_url: '{{ image_url | default('''') }}'
- variables:
    result:
      say: '{{ say }}'
      next: Your whole reply is exactly the text in say.
- response_variable: result
  stop: Shown
