# Two automations that go with script.clive_climate_zone (the 10 minute one is in clive-climate-automation.yaml). Copies of the live ones.
- alias: 'Clive: spot a manual heating change'
  description: When the mode, preset or target of a thermostat changes and the change did not come from one of Home Assistant's own automations or scripts (a person at the thermostat, in the Nest or Google Home app, in a dashboard or by voice), the zone script checks whether it was Clive's own echo and, if not, pauses Clive on that zone and tells people when he will take over again.
  mode: queued
  max: 10
  triggers:
  - trigger: state
    entity_id: climate.downstairs
    id: downstairs
  - trigger: state
    entity_id: climate.upstairs
    id: upstairs
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state not in ['unavailable', 'unknown'] and trigger.to_state.state not in ['unavailable', 'unknown']
         and (trigger.from_state.state != trigger.to_state.state
              or trigger.from_state.attributes.preset_mode != trigger.to_state.attributes.preset_mode
              or trigger.from_state.attributes.temperature != trigger.to_state.attributes.temperature)
         and (trigger.to_state.context.user_id is not none or trigger.to_state.context.parent_id is none) }}
  actions:
  - action: script.clive_climate_zone
    data:
      zone: '{{ trigger.id }}'
      by_hand: true
- alias: 'Clive: take over again when a pause ends'
  description: At the time a pause ends (input_datetime.clive_climate_<zone>_resume) Clive takes over the zone again and tells people.
  mode: queued
  max: 6
  triggers:
  - trigger: time
    at: input_datetime.clive_climate_downstairs_resume
    id: downstairs
  - trigger: time
    at: input_datetime.clive_climate_upstairs_resume
    id: upstairs
  actions:
  - action: script.clive_climate_zone
    data:
      zone: '{{ trigger.id }}'
- alias: 'Clive: offer to take over the heating when the alarm is disarmed'
  description: When the alarm goes from away to disarmed and Clive had turned a zone's heating off because it was set to away, he asks (a push notification with a Resume Clive button) whether to turn it back on and take over again. He never turns it on by himself; Resume Clive does it, because a person asked. Armed home changes nothing.
  mode: single
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.church_drive_alarm
    from: armed_away
    to: disarmed
  conditions:
  - condition: template
    value_template: >-
      {%- set ns = namespace(n=0) -%}
      {%- for zn in ['downstairs', 'upstairs'] -%}{%- set e = states('input_text.clive_climate_' ~ zn ~ '_expect') -%}{%- set j = (e | from_json(default={})) if e not in ['', 'unknown', 'unavailable'] else {} -%}{%- if j.away is defined and j.away and is_state('climate.' ~ zn, 'off') -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}{%- endfor -%}
      {{ ns.n > 0 }}
  actions:
  - action: church_drive.notify
    data:
      kind: clive_actions
      title: 🌡️ Welcome home
      message: Clive turned the heating off while the alarm was set to away. Shall he turn it back on and look after it again?
      tag: church-drive-clive-paused-welcome
      link: /dashboard-mobile/climate
