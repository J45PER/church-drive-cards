# Script script.jarvis_zappi_info: Everything about the car charge in one answer (plug, charger, mode, rate, cheap or not, cheapest rate, smart charge settings). Calls nothing; returns data. Also used by jarvis-zappi-charge. Everything is computed in ONE template on purpose: Home Assistant turns datetimes and lists into strings when they pass between script variables. A copy of the live script.
alias: Car charging info
description: 'Get the full picture of the car charge: whether a car is connected, what the charger is doing, its mode, power and charge added so far, the electricity rate right now and whether that counts as cheap, when the cheapest rate starts, and the smart charge settings. Use this to answer any question about the car or its charging.'
icon: mdi:ev-station
max: 5
mode: parallel
sequence:
- variables:
    result: '{%- set today_rates = state_attr(''event.octopus_energy_electricity_24l3478610_1160001231179_current_day_rates'', ''rates'') or [] -%}{%- set rates = today_rates + (state_attr(''event.octopus_energy_electricity_24l3478610_1160001231179_next_day_rates'', ''rates'') or []) -%}{%- set t = now() -%}{%- set d0 = today_at(states(''input_datetime.zappi_smart_charge_ready_by'')) -%}{%- set deadline = d0 if d0 > t else d0 + timedelta(days=1) -%}{%- set cur = rates | selectattr(''start'', ''le'', t) | selectattr(''end'', ''gt'', t) | list | first | default(none) -%}{%- set ahead = rates | selectattr(''end'', ''gt'', t) | selectattr(''start'', ''lt'', deadline) | list -%}{%- set cheapest = ahead | sort(attribute=''value_inc_vat'') | first | default(none) -%}{%- set low = (today_rates | map(attribute=''value_inc_vat'') | list | min) if today_rates else none -%}{%- set low_slot = (today_rates | selectattr(''value_inc_vat'', ''le'', low + 0.0001) | sort(attribute=''start'') | first | default(none)) if low is not none else none -%}{%- set in_view = cheapest is not none and low is not none and cheapest.value_inc_vat <= low * 1.1 + 0.0001 -%}{%- set max_p = states(''input_number.zappi_smart_charge_max_price'') | float(15) -%}{%- set cheap = cur is not none and cheapest is not none and cur.value_inc_vat <= cheapest.value_inc_vat * 1.1 + 0.0001 and cur.value_inc_vat * 100 <= max_p -%}{%- set connected = not is_state(''sensor.zappi_plug_status'', [''EV Disconnected'', ''unavailable'', ''unknown'']) -%}{{ {''car_connected'': connected, ''plug_status'': states(''sensor.zappi_plug_status''), ''plug_status_meaning'': ''Waiting for EV means the car is plugged in but is not asking to charge, usually because it is full. EV Disconnected means no car is plugged in.'', ''charger_status'': states(''sensor.zappi_status''), ''charge_mode'': states(''select.zappi_charge_mode''), ''charging_power_watts'': states(''sensor.zappi_charging_power''), ''charge_added_this_session_kwh'': states(''sensor.zappi_charge_added_session''), ''rate_known'': cur is not none, ''current_rate_pence_per_kwh'': ((cur.value_inc_vat * 100) | round(1)) if cur else none, ''rate_counts_as_cheap_now'': cheap, ''cheapest_rate_pence_per_kwh'': (((cheapest.value_inc_vat * 100) | round(1)) if in_view else (((low * 100) | round(1)) if low is not none else none)), ''cheapest_rate_starts'': (''now'' if (in_view and cur is not none and cheapest.start == cur.start) else (as_local(cheapest.start).strftime(''%H:%M'') if in_view else ((''tomorrow '' ~ as_local(low_slot.start).strftime(''%H:%M'')) if low_slot else none))), ''cheapest_rate_is_projected_from_todays_pattern'': (not in_view) and low_slot is not none, ''smart_charge_on'': states(''input_boolean.zappi_smart_charge''), ''smart_charge_state'': states(''input_select.zappi_smart_charge_state''), ''car_confirmed'': states(''input_boolean.zappi_car_confirmed''), ''ready_by'': states(''input_datetime.zappi_smart_charge_ready_by''), ''max_price_pence_per_kwh'': max_p} }}'
- response_variable: result
  stop: info
