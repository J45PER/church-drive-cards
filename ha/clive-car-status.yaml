# Script script.clive_car_status: How the car is: plugged in or not, charging or not, the battery and range when the car's own service answers. Exposed to Assist. It puts the car card on the screen itself (through clive_show_card) and returns the exact two sentences to say, so Clive no longer has to build the card or the wording. The Vauxhall Astra's own sensors (battery, range, charging end) come from the car's cloud service and are often unavailable: then the card shows what is known and `say` does not mention the battery. A copy of the live script.
alias: Car status
description: 'Use this for ANY question about how the car is, whether it is plugged in or charging, or its battery. It shows the card on the screen by itself and returns the words to say. Your whole reply must be exactly the text in "say", nothing before or after it, and do not call the card script as well. If they answer yes to the offer, answer from "more" in one natural sentence (when the cheapest rate starts, the rate now, when it will be ready by, or the smart charge state).'
icon: mdi:car-electric
mode: parallel
max: 5
sequence:
- action: script.clive_zappi_info
  response_variable: zi
- variables:
    battery: '{{ states(''sensor.amz_2927_vauxhall_astra_battery'') | float(none) }}'
    range_km: '{{ states(''sensor.amz_2927_vauxhall_astra_range'') | float(none) }}'
    range_unit: '{{ state_attr(''sensor.amz_2927_vauxhall_astra_range'', ''unit_of_measurement'') or '''' }}'
    watts: '{{ zi.charging_power_watts | float(0) }}'
    plugged: '{{ zi.car_connected | bool(false) }}'
- variables:
    charging: '{{ plugged and watts > 100 }}'
    label: >-
      {%- if not plugged -%}Not plugged in{%- elif watts > 100 -%}Charging{%- else -%}Plugged in{%- endif -%}
- variables:
    card: >-
      {%- set ns = namespace(d={'name': 'Vauxhall Astra', 'state': label}) -%}
      {%- if battery is not none -%}{%- set ns.d = dict(ns.d, battery=battery) -%}{%- endif -%}
      {%- if range_km is not none -%}{%- set ns.d = dict(ns.d, range=(range_km | round(0) | int) ~ ' ' ~ range_unit) -%}{%- endif -%}
      {%- if charging -%}{%- set ns.d = dict(ns.d, power=((watts / 1000) | round(1)) ~ ' kW') -%}{%- endif -%}
      {%- if zi.rate_known -%}{%- set ns.d = dict(ns.d, rate=(zi.current_rate_pence_per_kwh ~ 'p now')) -%}{%- endif -%}
      {{- ns.d -}}
    batt_words: '{{ '' and its battery is at '' ~ (battery | round(0) | int) ~ ''%'' if battery is not none else '''' }}'
- variables:
    say: >-
      {%- if not plugged -%}The Astra isn't plugged in{{ batt_words }}. Shall I tell you when the cheapest charging starts?
      {%- elif charging -%}The Astra's charging at {{ ((watts / 1000) | round(1)) }} kilowatts{{ batt_words }}. Shall I tell you what the rate is?
      {%- else -%}The Astra's plugged in{{ batt_words }} but not charging at the moment. Shall I tell you when it will start?
      {%- endif -%}
    more:
      cheapest_rate_pence_per_kwh: '{{ zi.cheapest_rate_pence_per_kwh }}'
      cheapest_rate_starts: '{{ zi.cheapest_rate_starts }}'
      current_rate_pence_per_kwh: '{{ zi.current_rate_pence_per_kwh }}'
      rate_counts_as_cheap_now: '{{ zi.rate_counts_as_cheap_now }}'
      smart_charge_state: '{{ zi.smart_charge_state }}'
      ready_by: '{{ zi.ready_by }}'
      charge_added_this_session_kwh: '{{ zi.charge_added_this_session_kwh }}'
      battery_known: '{{ battery is not none }}'
- action: script.clive_show_card
  data:
    kind: car
    data: '{{ card }}'
- variables:
    result:
      say: '{{ say }}'
      more: '{{ more }}'
      next: Your whole reply is exactly the text in say. The card is already on the screen.
- response_variable: result
  stop: Shown
