# Automation automation.clive_keep_the_climate_comfortable: every 10 minutes Clive checks each heating zone (script.clive_climate_zone). A copy of the live automation.
alias: 'Clive: keep the climate comfortable'
description: Every 10 minutes Clive checks each heating zone against its comfort range (script clive_climate_zone). He turns the heating on when a room is cold and down a step at a time (lower the target, eco, off) when it is hot, and tells the people ticked for 'Clive adjusted the house' in Manager. He leaves a zone alone while a timed run is going and while he is paused because somebody changed the thermostat.
mode: single
triggers:
- trigger: time_pattern
  minutes: /10
actions:
- action: script.clive_climate_zone
  data:
    zone: downstairs
  continue_on_error: true
- action: script.clive_climate_zone
  data:
    zone: upstairs
  continue_on_error: true
