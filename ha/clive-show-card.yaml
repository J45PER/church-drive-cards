# Script script.clive_show_card: lets Clive answer with a card on a screen that can draw one (the Church Drive phone and watch apps): the weather, a score or fixture, what is playing. Exposed to Assist. A copy of the live script (2026-10-22).
# It fires the event church_drive_assistant_show with a `card` in it. The event carries the asker's Home Assistant user, so only that person's phone and watch show it.
# The weather card fills itself from weather.forecast_home (now, today's high and low, the next 7 hours, and the place from zone.home), and the script returns the card
# to Clive so he can speak the real figures (that entity is not exposed to Assist, which keeps Home Assistant's own built-in weather answer from taking the question).
# Club badges are found by the apps themselves from the team's name. Anything without a screen ignores the event, so his spoken answer must stand alone.
# 2026-10-31: data.day shows another day's card (the daily forecast starts with yesterday after midnight, so the day is found by its date, not its place in the list); today's card now takes today's high and low.
alias: Show a card on screen
description: 'Show a card on the screen of the person who asked, when the answer is something to see: the weather, a sports score, a team''s next game, what is playing. Call it FIRST, with no words before it, then give your spoken answer as your final reply. kind is one of: weather, score, scores, fixture, fixtures, music, people, done, car, climate, gregg, air, energy, secure, doors, tasks, devices, lights, heat, shop, event, reminder, media, answer. For the weather at Church Drive give kind only: the card fills itself from the weather forecast. For the weather ANYWHERE ELSE (a town, a holiday place, another country) search the web for the real figures first, then give kind weather with data holding location (the place name), temp (a number in degrees Celsius), symbol (one of sunny, clear-night, partlycloudy, cloudy, rainy, pouring, snowy, fog, windy, lightning-rainy), desc (two or three words such as Sunny), high, low, and hourly as an empty list, so the card shows that place and never Church Drive. For the others data holds the fields. score: home and away, each {name, short (three letters)}, home_score, away_score, status ("Full time", "74''", "Half time") and scorers (one short line). fixtures: the coming games of a league or competition as a list, data is {title (optional, the competition), sport (optional), rows: a list of {home, away, home_short, away_short, when (the date, "Sat 24 Oct"), time ("15:00")}} (the clive_fixtures script builds this for you). scores: several results as a table, data is {title (optional, e.g. "Champions League"), rows: a list of {home, away, home_score, away_score, status} with home and away as for score}; fixture: home and away as for score, title ("Man City v Aston Villa"), when ("Sat 24 Oct"), time ("12:30"), where (the ground), comp (the competition) and in ("in 2 days"). music: title, artist and device (where it is playing). people: rows, a list with one {name, state, detail} for each person, where state is home, not_home, a place name, or unknown, and detail is a short line such as "since 11:40". done: a receipt for something you have just done and the tool confirmed, with name (what, e.g. "Lounge lights"), detail ("Dimmed to 30%"), icon (an mdi icon, optional), percent (0 to 100 for a level, optional) and colour (the light''s own colour as #rrggbb, optional); set ok false only if it failed. car: name, battery (a number, the percentage), state ("Charging", "Plugged in", "Not plugged in"), range ("142 miles"), power ("7.4 kW"), until ("Full by 06:10") and rate ("3.8p/kWh"). score, scores and fixture may also carry sport (football by default; tennis, golf, cricket, rugby, basketball, baseball, hockey, f1, boxing, darts, cycling, swimming, athletics, snooker) and comp (the competition), which choose the icon. car may carry brand (the make, for its logo) and music app (the service, for its logo). The cards from energy to answer all use one layout, so data holds any of: big (a large figure such as "28.9p"), title, sub (a line under it), pill and pill_tone, rows (a list of {name, detail, value, pill, tone, marker} where marker is ok, warn, todo, done or dot and tone is green, amber, orange, red, blue, teal, indigo, purple or grey), percent (0 to 100, a bar), foot (a line at the bottom) and tone (the card colour). energy is the price now and the day''s use, secure is whether the house is safe (alarm, doors, windows, lights), doors is each door and gate, tasks is the to-do list, devices is anything needing attention, lights is which rooms have lights on, heat is a timed heating run, shop is the shopping list, event is the next calendar event, reminder confirms a reminder, media is what is on the TVs and speakers, answer is a short answer from the web with its source in pill. climate, gregg and air: the house''s own scripts (house climate, robot vacuum, air quality) show these themselves, so do not call this for them. The club badges are found by the screen itself, so do not search for them. For the weather at Church Drive, data {day: 1} (1 is tomorrow, 2 the day after, up to 5) shows that day''s card with its high, low and, for tomorrow, its hours; data {quiet: true} skips the card and just returns the forecast (days and hours) in the result, for follow-up questions. It does nothing on a device with no screen.'
fields:
  data:
    description: The fields for that kind (not needed for the weather at Church Drive).
    name: Card fields
    required: false
    selector:
      object: {}
  kind:
    description: weather, score, scores, fixture, fixtures, music, people, done, car, climate, gregg, air, energy, secure, doors, tasks, devices, lights, heat, shop, event, reminder, media or answer.
    name: Kind of card
    required: true
    selector:
      select:
        options:
        - weather
        - score
        - scores
        - fixture
        - fixtures
        - music
        - people
        - done
        - car
        - climate
        - gregg
        - air
        - energy
        - secure
        - doors
        - tasks
        - devices
        - lights
        - heat
        - shop
        - event
        - reminder
        - media
        - answer
icon: mdi:card-text-outline
max: 5
mode: parallel
sequence:
- condition: template
  value_template: '{{ kind in [''weather'', ''score'', ''scores'', ''fixture'', ''fixtures'', ''music'', ''people'', ''done'', ''car'', ''climate'', ''gregg'', ''air'', ''energy'', ''secure'', ''doors'', ''tasks'', ''devices'', ''lights'', ''heat'', ''shop'', ''event'', ''reminder'', ''media'', ''answer''] }}'
- if:
  - condition: template
    value_template: '{{ kind == ''weather'' }}'
  then:
  - action: weather.get_forecasts
    continue_on_error: true
    data:
      type: daily
    response_variable: fc
    target:
      entity_id: weather.forecast_home
  - action: weather.get_forecasts
    continue_on_error: true
    data:
      type: hourly
    response_variable: fh
    target:
      entity_id: weather.forecast_home
- variables:
    card: '{% set e = ''weather.forecast_home'' %}{% set dd = ((data.day | int(0)) if (data is defined and data and data.day is defined) else 0) %}{% set target = (now() + timedelta(days=dd)).date() %}{% set pk = namespace(d={}) %}{% for x in (fc[e].forecast if (fc is defined and fc and e in fc and fc[e].forecast) else []) %}{% if not pk.d and (as_datetime(x.datetime) | as_local).date() == target %}{% set pk.d = x %}{% endif %}{% endfor %}{% set d = (pk.d if pk.d else (fc[e].forecast[0] if (dd == 0 and fc is defined and fc and e in fc and fc[e].forecast) else {})) %}{% set tdate = (target if dd > 0 else none) %}{% set pick = namespace(h=[]) %}{% if dd == 0 %}{% set pick.h = (fh[e].forecast[:7] if (fh is defined and fh and e in fh and fh[e].forecast) else []) %}{% elif tdate %}{% for h in (fh[e].forecast if (fh is defined and fh and e in fh and fh[e].forecast) else []) %}{% set hd = as_datetime(h.datetime) | as_local %}{% if hd.date() == tdate and hd.hour in [7, 9, 11, 13, 15, 17] %}{% set pick.h = pick.h + [h] %}{% endif %}{% endfor %}{% endif %}{% set hrs = pick.h %}{% set ns = namespace(l=[]) %}{% for h in hrs %}{% set ns.l = ns.l + [{''t'': (as_datetime(h.datetime) | as_local).strftime(''%H:%M''), ''temp'': h.temperature, ''symbol'': h.condition}] %}{% endfor %}{% set given = data if (data is defined and data) else {} %}{% set tom = ({''symbol'': d.condition, ''temp'': d.temperature, ''desc'': (d.condition | replace(''-'', '' '') | replace(''partlycloudy'', ''partly cloudy'') | replace(''lightning rainy'', ''thunder and rain'') | capitalize), ''location'': ((as_datetime(d.datetime) | as_local).strftime(''%A'') ~ '' · '' ~ (state_attr(''zone.home'', ''friendly_name'') or ''''))} if (dd > 0 and d) else {}) %}{% if kind == ''weather'' %}{{ ({''symbol'': states(e), ''temp'': state_attr(e, ''temperature''), ''desc'': (states(e) | replace(''-'', '' '') | replace(''partlycloudy'', ''partly cloudy'') | replace(''lightning rainy'', ''thunder and rain'') | capitalize), ''high'': d.get(''temperature''), ''low'': d.get(''templow''), ''rain'': d.get(''precipitation_probability''), ''location'': state_attr(''zone.home'', ''friendly_name''), ''hourly'': ns.l} | combine(tom) | combine(given)) | combine({''kind'': kind}) }}{% else %}{{ given | combine({''kind'': kind}) }}{% endif %}'
    detail: '{% set e = ''weather.forecast_home'' %}{% set days = (fc[e].forecast[:5] if (fc is defined and fc and e in fc and fc[e].forecast) else []) %}{% set hrs = (fh[e].forecast[:14] if (fh is defined and fh and e in fh and fh[e].forecast) else []) %}{% set ns = namespace(d=[], h=[]) %}{% for d in days %}{% set ns.d = ns.d + [{''day'': (as_datetime(d.datetime) | as_local).strftime(''%A''), ''condition'': d.condition, ''high'': d.temperature, ''low'': d.templow, ''rain_chance_percent'': d.get(''precipitation_probability'')}] %}{% endfor %}{% for h in hrs %}{% set ns.h = ns.h + [{''time'': (as_datetime(h.datetime) | as_local).strftime(''%H:%M''), ''temp'': h.temperature, ''condition'': h.condition, ''rain_mm'': h.get(''precipitation''), ''wind_mph'': h.get(''wind_speed'')}] %}{% endfor %}{{ {''days'': ns.d, ''hours'': ns.h} }}'
- if:
  - condition: template
    value_template: '{{ not (data is defined and data and data.get(''quiet'')) }}'
  then:
  - event: church_drive_assistant_show
    event_data:
      card: '{{ card }}'
- variables:
    result:
      ok: true
      card: '{{ card }}'
      next: The card is on the screen (unless quiet was asked). Now give your spoken answer as your final reply, as one natural sentence from the figures in card (temperatures are in degrees Celsius), and do not mention the card. For the weather at Church Drive, forecast holds the next days and hours, for tonight, tomorrow or rain questions. For another place, use only the figures you gave.
      forecast: '{{ (detail | to_json) if (kind == ''weather'' and not (data is defined and data and data.get(''location''))) else none }}'
- response_variable: result
  stop: Shown
