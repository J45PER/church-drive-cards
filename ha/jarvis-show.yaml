# Script script.jarvis_show: lets Clive put a picture and/or a link on the screen of the Church Drive app of the person who asked. Exposed to Assist. A copy of the live script.
# It only fires an event (church_drive_clive_show). The event carries the asker's Home Assistant user, so the app of that person (and nobody else's) shows it under his answer.
# Anything without a screen ignores it, so Clive can call it every time without harm.
alias: Show on screen (Clive)
description: 'Show a picture and/or a link on the screen of the person who asked, under your spoken answer. Use it when a picture or a web page genuinely helps (a player, a recipe, a product, a map, a match report) and you have a real https address for it from a web search. Give image_url for a picture and link_url for a page, either or both, and a short link_label such as "Match report". Never say you have shown something unless this returned ok. It does nothing on a device with no screen, so never rely on it: your spoken answer must still make sense alone.'
fields:
  image_url:
    description: Direct https address of a picture (not a web page).
    name: Image address
    required: false
    selector:
      text: {}
  link_url:
    description: https address of a web page.
    name: Link address
    required: false
    selector:
      text: {}
  link_label:
    description: Two to four words naming the link.
    name: Link label
    required: false
    selector:
      text: {}
icon: mdi:image-text
mode: parallel
max: 5
sequence:
- condition: template
  value_template: >-
    {{ (image_url | default('') | string).startswith('https://') or (link_url | default('') | string).startswith('https://') }}
- event: church_drive_clive_show
  event_data:
    image_url: "{{ image_url | default('') }}"
    link_url: "{{ link_url | default('') }}"
    link_label: "{{ link_label | default('') }}"
- variables:
    result: { ok: true }
- stop: Shown
  response_variable: result
