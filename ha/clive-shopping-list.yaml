alias: Shopping list
description: 'Use this when someone asks what is on the shopping list or what we need to get. It returns the words to say: how many things there are and what they are, and anything that was not available last time. Your whole reply must be exactly the text in "say".'
icon: mdi:cart
mode: parallel
max: 5
sequence:
- action: church_drive.shopping_read
  response_variable: r
- variables:
    names: '{%- set ns = namespace(l=[]) -%}{%- for i in r.open -%}{%- set ns.l = ns.l + [i.text ~ ('' x'' ~ i.qty if i.qty > 1 else '''')] -%}{%- endfor -%}{{ ns.l }}'
- variables:
    say: '{%- if names | count == 0 -%}There is nothing on the shopping list.{%- else -%}There {{ ''is 1 thing'' if names | count == 1 else ''are '' ~ (names | count) ~ '' things'' }} to get: {{ names[:10] | join('', '') }}{{ '' and '' ~ (names | count - 10) ~ '' more'' if names | count > 10 else '''' }}.{%- endif -%}{%- if r.not_available_last_time | count > 0 %} Last time {{ r.not_available_last_time | join('', '') }} {{ ''was'' if r.not_available_last_time | count == 1 else ''were'' }} not available.{%- endif -%}'
- variables:
    result:
      say: '{{ say }}'
- stop: Done
  response_variable: result
