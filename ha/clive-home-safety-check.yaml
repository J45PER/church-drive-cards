# Script script.clive_home_safety_check: Read-only: smoke/heat/CO alarms, tamper alerts and low batteries of home devices (phones excluded, found by device not by integration since the battery-low sensors come from Battery Notes). Finds devices by device class, so new alarms and sensors are included automatically. A copy of the live script.
alias: Home safety and batteries check
description: 'Read-only check of the home''s safety and battery state. Reports any smoke, heat or carbon monoxide alarm that is going off, any tamper alert, which home devices (door and motion sensors, dials, smoke alarms and so on, not phones) have a low battery and need changing or charging, any alarm near the end of its life or silenced, and anything that could not be checked. Use it for ''is the house safe'', ''are the smoke alarms ok'', ''do any batteries need changing'' and similar questions. It cannot silence, test or reset anything. IMPORTANT: this only covers smoke/heat/CO alarms, tamper alerts and device batteries. It does NOT check doors, windows, locks or the burglar alarm, so never say the house is secure or safe overall; report only what was checked.'
icon: mdi:shield-check
max: 5
mode: parallel
sequence:
- variables:
    result: '{%- set mobile_devs = integration_entities(''mobile_app'') | map(''device_id'') | select(''string'') | list | unique | list -%}{%- set bs = states.binary_sensor | selectattr(''attributes.device_class'', ''defined'') | list -%}{%- set alarms = bs | selectattr(''attributes.device_class'', ''in'', [''smoke'', ''heat'', ''carbon_monoxide'']) | list -%}{%- set tampers = bs | selectattr(''attributes.device_class'', ''eq'', ''tamper'') | list -%}{%- set ns = namespace(batts=[]) -%}{%- for s in bs | selectattr(''attributes.device_class'', ''eq'', ''battery'') -%}{%- if device_id(s.entity_id) not in mobile_devs -%}{%- set ns.batts = ns.batts + [s] -%}{%- endif -%}{%- endfor -%}{%- set batts = ns.batts -%}{%- set eol = states.binary_sensor | selectattr(''name'', ''search'', ''End-of-Life'') | selectattr(''state'', ''eq'', ''on'') | list -%}{%- set muted = states.binary_sensor | selectattr(''name'', ''search'', ''Silenced'') | selectattr(''state'', ''eq'', ''on'') | list -%}{%- set alarms_on = alarms | selectattr(''state'', ''eq'', ''on'') | list -%}{%- set tamper_on = tampers | selectattr(''state'', ''eq'', ''on'') | list -%}{%- set batt_low = batts | selectattr(''state'', ''eq'', ''on'') | list -%}{%- set unknown = (alarms + tampers + batts) | selectattr(''state'', ''in'', [''unavailable'', ''unknown'']) | list -%}{{ {''all_clear'': (alarms_on | count == 0) and (tamper_on | count == 0) and (batt_low | count == 0) and (eol | count == 0), ''smoke_heat_co_alarms_active'': alarms_on | map(attribute=''name'') | map(''replace'', '' Alarm Status'', '''') | list, ''smoke_heat_co_alarms_checked'': alarms | count, ''tamper_alerts'': tamper_on | map(attribute=''name'') | map(''replace'', '' Tamper'', '''') | list, ''tamper_sensors_checked'': tampers | count, ''home_device_batteries_low'': batt_low | map(attribute=''name'') | map(''replace'', '' Battery low'', '''') | list, ''home_device_batteries_checked'': batts | count, ''alarms_near_end_of_life'': eol | map(attribute=''name'') | map(''replace'', '' End-of-Life'', '''') | list, ''alarms_silenced'': muted | map(attribute=''name'') | map(''replace'', '' Device Silenced'', '''') | list, ''could_not_check'': unknown | map(attribute=''name'') | list, ''scope'': ''Only smoke, heat and CO alarms, tamper alerts and device batteries were checked. Doors, windows, locks and the burglar alarm were NOT checked, so do not say the house is secure.''} }}'
- response_variable: result
  stop: checked
