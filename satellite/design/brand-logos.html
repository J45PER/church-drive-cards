<title>Church Drive Brand Logos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Material+Icons+Outlined&display=block">
<style>
/* Layout: each option is a row of bare glyphs (no disc, no ring) on a white or black page, then the same row at 32 and 20 px. */
:root{--bar-bg:#e9ebef;--bar-fg:#14181f;--bar-soft:#5b6472;--stage-bg:#fff;--stage-fg:#000;--stage-soft:#5f6672;--stage-line:#e0e3e8;--ui:"Instrument Sans",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bar-bg:#1a1f27;--bar-fg:#eef1f5;--bar-soft:#9aa4b2;color-scheme:dark}}
:root[data-theme="dark"]{--bar-bg:#1a1f27;--bar-fg:#eef1f5;--bar-soft:#9aa4b2;color-scheme:dark}
:root[data-page="dark"]{--stage-bg:#000;--stage-fg:#fff;--stage-soft:#9aa0aa;--stage-line:#262a31}
*{box-sizing:border-box}
body{background:var(--bar-bg);color:var(--bar-fg);font-family:var(--ui);margin:0;line-height:1.4}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding-block:20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
.top h1{font-size:1.3rem;margin:0;letter-spacing:-.01em}.top p{margin:2px 0 0;color:var(--bar-soft);font-size:.86rem;max-width:70ch}
.seg{display:inline-flex;background:color-mix(in srgb,var(--bar-soft) 25%,transparent);border-radius:999px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:.88rem;border:0;background:none;color:var(--bar-soft);padding:7px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bar-fg);color:var(--bar-bg)}
.seg button:focus-visible{outline:2px solid var(--bar-fg);outline-offset:2px}
.stage{background:var(--stage-bg);color:var(--stage-fg);min-height:70vh;padding-block:28px 56px}
.in{max-width:1100px;margin:0 auto;display:grid;gap:34px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rowlabel{font-size:.86rem;color:var(--stage-soft);margin:0 0 10px}.rowlabel b{color:var(--stage-fg);font-weight:600}
.grid5,.grid3{display:grid;gap:12px}.grid5{grid-template-columns:repeat(5,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:660px}
.col{display:grid;gap:8px;justify-items:center;align-content:start;min-width:0}
.box{width:100%;aspect-ratio:1;border:1px solid var(--stage-line);border-radius:22px;display:grid;place-items:center;padding:14%}
.box svg{width:100%;height:100%;display:block;overflow:visible}
.cl{font-size:.88rem;text-align:center}.cl b{display:block;font-weight:600}.cl span{color:var(--stage-soft);font-size:.76rem}
.small{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:12px}
.sm{display:flex;gap:12px;align-items:center;justify-content:center;height:40px}.sm svg{width:100%;height:100%;display:block}
.note{color:var(--stage-soft);font-size:.86rem;max-width:72ch}
@media (max-width:560px){.grid5,.small{gap:6px}.box{border-radius:14px}}
.gridP{display:flex;flex-wrap:wrap;gap:16px}
.pairc{display:grid;gap:6px;justify-items:center}
.pr{display:flex;gap:8px}
.cell{display:grid;gap:4px;justify-items:center}
.icon{width:min(34vw,150px);height:min(34vw,150px);border:1px solid var(--stage-line);border-radius:20px;display:grid;place-items:center;padding:8%}
.icon svg{width:100%;height:100%;display:block;overflow:visible}
.cl small{font-size:.7rem;color:var(--stage-soft)}
.cl2{font-size:.88rem}

.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.mi1 { border: 1px solid var(--stage-line); border-radius: 14px; padding: 10px 6px 8px; display: grid; gap: 5px; justify-items: center; align-content: start; text-align: center; min-width: 0; }
.mi1 .g { width: 34px; height: 34px; display: grid; place-items: center; color: var(--stage-fg); }
.mi1 .g svg { width: 30px; height: 30px; display: block; }
.mi1 .nm { font-size: .68rem; font-weight: 600; word-break: break-word; line-height: 1.25; }
.mi1 .by { font-family: var(--mono); font-size: .58rem; color: var(--stage-soft); line-height: 1.3; }
.mfont { font-family: "Material Icons"; font-style: normal; font-weight: normal; font-size: 30px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; font-feature-settings: "liga"; -webkit-font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; }
.mfont.o { font-family: "Material Icons Outlined"; }
</style>
<div class="top"><div><h1>Church Drive brand logos</h1><p>The logos traced for the apps (competitions, services and makes), one colour. Every other logo comes from Simple Icons by name.</p></div>
<div class="seg" role="group" aria-label="Page"><button type="button" id="pl" aria-pressed="true">Light icons</button><button type="button" id="pd" aria-pressed="false">Dark icons</button></div></div>
<div class="stage"><div class="in"><div id="sections"></div><p class="note">Traced from the brand artwork, one colour each.</p></div></div>

  var CLIVE = "M103.3,50.7L119.3,50.7C135.87,50.7 149.3,64.13 149.3,80.7L149.3,96.7C149.3,110.98 139.32,122.93 125.96,125.96C122.93,139.32 110.98,149.3 96.7,149.3L80.7,149.3C64.13,149.3 50.7,135.87 50.7,119.3L50.7,103.3C50.7,89.02 60.68,77.07 74.04,74.04C77.07,60.68 89.02,50.7 103.3,50.7ZM80.7,73.3C78.41,73.3 76.18,73.56 74.04,74.04C73.56,76.18 73.3,78.41 73.3,80.7L73.3,96.7C73.3,113.27 86.73,126.7 103.3,126.7L119.3,126.7C121.59,126.7 123.82,126.44 125.96,125.96C126.44,123.82 126.7,121.59 126.7,119.3L126.7,103.3C126.7,86.73 113.27,73.3 96.7,73.3Z";

  var DEVB = {
    plus: { d: 'M100,52 V148 M52,100 H148', stroke: 18, scale: 0.36 },
    history: { d: 'M44,100 A56,56 0 1 0 62,58 M62,58 L40,56 M62,58 L64,80 M100,66 V100 L124,114', stroke: 16, scale: 0.4 },

  };
  function drawDev(kind) {
    var b = DEVB[kind], id = 'dv' + (uid++), sc = 0.56, bx = b ? -16 : 0, by = b ? -10 : 0, glyph = '';
    if (b) {
      var d = b.mdi ? STATIC['m:' + b.mdi] : b.d, box = b.mdi ? 24 : 200, gs = b.mdi ? 2.0 : b.scale, gt = 'translate(' + (146 - box / 2 * gs) + ' ' + (146 - box / 2 * gs) + ') scale(' + gs + ')';

  }
  var NONEW = { mop: 1, wash: 1, find: 1, idle: 1, docked: 1, cleaning: 1, paused: 1, returning: 1, error: 1 };
  var NOOLD = { vac: 1 };
  var OLDMAP = { idle: 'idle', docked: 'docked', cleaning: 'cleaning', paused: 'paused', returning: 'returning', error: 'error', vac: 'vac', mop: 'mop', both: 'both', empty: 'empty', wash: 'wash', dry: 'dry', find: 'find', filter: 'filter', roller: 'roller', side: 'side', cloth: 'cloth', sensor: 'sensor', tray: 'tray' };

  });

  var els = [].slice.call(document.querySelectorAll('.icon[data-a="1"]'));
  function tick(ms) {
    els.forEach(function (el) {
      var id = el.getAttribute('data-id'), k = el.getAttribute('data-k'), t = (ms % PERIOD[id]) / PERIOD[id];
      el.innerHTML = k === 'old' ? drawOld(OLDMAP[id], t) : drawNew(id, t, 1);

  pl.addEventListener('click', function () { page(false); });

})();
