    if (kind === 'head') art = '<span class="disc" style="' + tint(tone) + '">' + ic(mdiName, 20) + '</span>';
    else if (kind === 'row') art = '<span class="disc l" style="' + tint(tone) + '">' + ic(mdiName, 22) + '</span>';
    else art = '<span class="bare">' + ic(mdiName, 28) + '</span>';
    return '<div class="it">' + num() + art + '<div class="lbl"><b>' + title + '</b><span>' + where + '</span></div>' +
      '<div class="from">' + (was ? '<s>was ' + was + '</s> &rarr; ' : '') + '<code>' + mdiName + '</code> &middot; ' + from + '</div></div>';
  }
  out += '<section><h2>Bottom bar and top bar</h2><p class="lead">Swapped to the icons the main app already uses for the same things.</p><div class="grid">' +
    swap('bare', 'speaker', '', 'Satellites', 'bottom bar, first tab', 'speaker', 'the media card\'s speaker (MediaCard.kt, media-card.js)') +
    swap('bare', 'plus', '', 'Add', 'bottom bar, second tab', 'qr code scanner', 'Add in the shopping lists (ShoppingScreen.kt)') +
    swap('bare', 'arrow-left', '', 'Back', 'satellite page and panel pages', 'arrow back', 'the shopping list and media pad Back') +
    swap('bare', 'close', '', 'Close', 'account panel', 'close', 'Cancel and Not available (ShoppingScreen.kt), the same shape') + '</div></section>';
  out += '<section><h2>List</h2><p class="lead">The Home header takes the house\'s own icon from the Church Drive icons board.</p><div class="grid">' +
    swap('head', 'cd:home', 'indigo', 'Home', 'list header', 'home', 'the house icon on the Church Drive icons board') +
    swap('head', 'plus', 'teal', 'Add a satellite', 'Add tab header', 'qr code scanner', 'Add in the shopping lists') +
    swap('row', 'speaker', 'indigo', 'A satellite', 'each row of the list', 'monitor', 'a speaker device (MediaCard.kt)') + '</div></section>';
  out += '<section><h2>A satellite\'s page, section headers</h2><p class="lead">Same tinted circles and colours. No section changed colour; only the glyph inside.</p><div class="grid">' +
    swap('head', 'palette', 'indigo', 'Design', 'section', 'palette', 'the colour tab in the light settings (LightSettings.kt)') +
    swap('head', 'thermometer', 'amber', 'Temperatures', 'section', 'thermostat', 'the temperature in Clive\'s weather card (AssistCards.kt)') +
    swap('head', 'tune-variant', 'teal', 'Glances', 'section', 'tune', 'the Cleaning settings section (CleaningPage.kt) and the climate card') +
    swap('head', 'brightness-6', 'blue', 'Backlight', 'section', 'brightness 6', 'the brightness tiles in the light settings (LightSettings.kt)') +
    swap('head', 'volume-high', 'coral', 'Sound', 'section', 'volume up', 'the media card volume and Clive\'s spoken answers (AssistScreen.kt)') +
    swap('head', 'account-voice', 'indigo', 'Voice', 'section', 'record voice over', 'Clive\'s voice (AssistData.kt, the Clive sensor)') +
    swap('head', 'cog-outline', 'purple', 'On the satellite', 'section', 'speaker', 'the Settings sections (CleaningPage.kt, AssistScreen.kt)') +
    swap('head', 'wifi-strength-4', 'green', 'Status', 'section', 'info', 'the signal bars (CameraData.kt signalIconName)') +
    swap('head', 'update', 'orange', 'Firmware', 'section', 'system update', 'Updates (EnergyData.kt)') +
    swap('head', 'map-marker-outline', 'teal', 'Name and room', 'section', 'location on', 'places (ShoppingScreen.kt)') +
    swap('head', 'power', 'red', 'Actions', 'section', 'restart alt', 'power in the media card (MediaCard.kt)') +
    swap('head', 'content-save-outline', 'orange', 'Presets and copying', 'section', 'content copy', 'Backups, a saved copy (EnergyData.kt)') + '</div></section>';
  out += '<section><h2>Account panel (tap your initial)</h2><p class="lead">These were already the other apps\' icons (the account panel is the main app\'s and To-Do\'s pattern), so only the signing certificate changes: the main app shows it with the info icon.</p><div class="grid">' +
    bare('home', 'Open Church Drive', 'account page, as in the other apps', true) + bare('settings', 'Settings', 'account page row, as in the other apps', true) + bare('info', 'About', 'account page row, as in the other apps', true) + bare('logout', 'Sign out', 'account page, as in the other apps', true) +
    bare('visibility', 'Open on the satellite I left', 'Settings page, as in To-Do', true) + bare('settings', 'Each satellite\'s own settings', 'Settings page, as in To-Do', true) +
    bare('info', 'Church Drive Satellites, version', 'About page, as in the other apps', true) + bare('system_update', 'Updates', 'About page, as in the other apps', true) +
    '<div class="it">' + num() + '<span class="bare">' + mi('info', 'big o') + '</span><div class="lbl"><b>Signing certificate</b><span>About page</span></div><div class="from"><s>was fingerprint</s> &rarr; <code>info (outlined)</code> &middot; the main app\'s certificate row (AccountPanel.kt)</div></div>' + '</div></section>';
  out += '<section><p class="lead">Everything else in the app is text only: the tiles, pills and buttons (Say hello, Flash the screen, Restart, Install the update and so on) carry no icon.</p></section>';
  document.getElementById('in').innerHTML = out;
  var pl = document.getElementById('pl'), pd = document.getElementById('pd');
  function page(dark) { document.documentElement.setAttribute('data-page', dark ? 'dark' : 'light'); pl.setAttribute('aria-pressed', String(!dark)); pd.setAttribute('aria-pressed', String(dark)); }
  pl.addEventListener('click', function () { page(false); });
  pd.addEventListener('click', function () { page(true); });
})();
</script>
