script:
- id: ui_bind
  then:
  - lambda: |-
      // Fills clive::w with the widgets declared in ui.yaml (generated by tools/gen_ui.py).
      clive::w.glow = id(glow);
      clive::w.blob[0] = id(blob0);
      clive::w.blob[1] = id(blob1);
      clive::w.blob[2] = id(blob2);
      clive::w.vignette = id(vignette);
      clive::w.idle[0] = id(idle_glance);
      clive::w.idle[1] = id(idle_clock);
      clive::w.idle[2] = id(idle_weather);
      clive::w.idle[3] = id(idle_ring);
      clive::w.card = id(card);
      clive::w.dock = id(dock);
      clive::w.shade = id(shade);
      clive::w.menu = id(menu);
      clive::w.pair = id(pair);
      clive::w.mark[0] = id(mark_idle);
      clive::w.mark[1] = id(mark_listen);
      clive::w.mark[2] = id(mark_think);
      clive::w.mark[3] = id(mark_speak);
      clive::w.time_label[0] = id(time_glance);
      clive::w.time_label[1] = id(time_clock);
      clive::w.time_label[2] = id(time_weather);
      clive::w.time_label[3] = id(time_ring);
      clive::w.glance_date = id(glance_date);
      clive::w.glance_out = id(glance_out);
      clive::w.glance_in = id(glance_in);
      clive::w.date_label[1] = id(clock_date);
      clive::w.clock_temp = id(clock_temp);
      clive::w.clock_icon = id(clock_icon);
      clive::w.weather_icon = id(weather_icon);
      clive::w.weather_temp = id(weather_temp);
      clive::w.weather_cond = id(weather_cond);
      clive::w.weather_hl = id(weather_hl);
      clive::w.weather_small_date = id(weather_small_date);
      clive::w.ring_date = id(ring_date);
      clive::w.ring_sec = id(ring_sec);
      clive::w.ring_hour = id(ring_hour);
      clive::w.g_icon[0] = id(g_icon0);
      clive::w.g_icon[1] = id(g_icon1);
      clive::w.g_icon[2] = id(g_icon2);
      clive::w.g_value[0] = id(g_value0);
      clive::w.g_value[1] = id(g_value1);
      clive::w.g_value[2] = id(g_value2);
      clive::w.g_label[0] = id(g_label0);
      clive::w.g_label[1] = id(g_label1);
      clive::w.g_label[2] = id(g_label2);
      clive::w.card_icon = id(card_icon);
      clive::w.card_big = id(card_big);
      clive::w.card_title = id(card_title);
      clive::w.card_sub = id(card_sub);
      clive::w.card_row[0] = id(card_row0);
      clive::w.card_row[1] = id(card_row1);
      clive::w.card_row[2] = id(card_row2);
      clive::w.card_bar = id(card_bar);
      clive::w.card_yes = id(card_yes);
      clive::w.card_no = id(card_no);
      clive::w.card_stack = id(card_stack);
      clive::w.qs_volume = id(qs_volume);
      clive::w.qs_bright = id(qs_bright);
      clive::w.pair_qr = id(pair_qr);
      clive::w.pair_code = id(pair_code);
      clive::w.tile[0] = id(t_mic);
      clive::w.tile[1] = id(t_voice);
      clive::w.tile[2] = id(t_follow);
      clive::w.tile[3] = id(t_night);
      clive::w.tile[4] = id(t_clean);
      clive::st_dim = id(st_dim); clive::st_faint = id(st_faint); clive::st_soft = id(st_soft);
      ESP_LOGI("clive", "widgets bound, glow=%p dock=%p", (void *) clive::w.glow, (void *) clive::w.dock);
      clive::init_ui();
- id: ui_update_info
  parameters:
    outside: string
    cond: string
    high: string
    low: string
    inside: string
    g_home: string
    g_energy: string
    g_car: string
    g_alarm: string
    g_heat: string
    g_air: string
  then:
  - lambda: |-
      clive::info.outside = outside;
      clive::info.cond = cond;
      clive::info.high = high;
      clive::info.low = low;
      clive::info.inside = inside;
      clive::info.g_home = g_home;
      clive::info.g_energy = g_energy;
      clive::info.g_car = g_car;
      clive::info.g_alarm = g_alarm;
      clive::info.g_heat = g_heat;
      clive::info.g_air = g_air;
      clive::update_info_labels();
- id: ui_set_state
  parameters:
    state: int
  then:
  - lambda: |-
      clive::set_state(state);
- id: ui_card_timer
  mode: restart
  parameters:
    seconds: int
  then:
  - delay: !lambda |-
      return seconds * 1000;
  - lambda: |-
      clive::card_hide();
- id: ui_show_card
  mode: restart
  parameters:
    icon: string
    big: string
    title: string
    sub: string
    r1: string
    r2: string
    r3: string
    percent: int
    ask: bool
    pal: string
    seconds: int
  then:
  - lambda: |-
      clive::card_show_args(icon, big, title, sub, r1, r2, r3, percent, ask, pal);
  - script.execute:
      id: ui_card_timer
      seconds: !lambda |-
        return ask ? 300 : seconds;
- id: ui_hide_card
  then:
  - script.stop: ui_card_timer
  - lambda: |-
      clive::card_hide();
interval:
- interval: 60ms
  then:
  - lambda: |-
      static uint32_t last = 0; uint32_t now = esphome::millis();
      float dt = last ? (now - last) / 1000.0f : 0.06f; last = now;
      clive::tick(dt > 0.2f ? 0.2f : dt);
- interval: 1s
  then:
  - lambda: |-
      auto t = id(clock_time).now(); if (!t.is_valid()) return;
      static const char *DAYS[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
      static const char *MONTHS[] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
      char d[24]; snprintf(d, sizeof d, "%s %d %s", DAYS[(t.day_of_week + 6) % 7], t.day_of_month, MONTHS[t.month - 1]);
      clive::update_time(t.hour, t.minute, t.second, d, d);
