# Copy to secrets.yaml (it is git-ignored) and fill in. Never commit the real one.
# The Wi-Fi is not here: the companion app sends it to the satellite over Bluetooth when you pair it (docs/SATELLITE-PAIRING.md).
# Generate an API key with: esphome -q wizard, or python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
# Use the same key for every satellite: the companion app asks for it once, to add each one to Home Assistant.
clive_round_api_key: "BASE64_32_BYTE_KEY"
