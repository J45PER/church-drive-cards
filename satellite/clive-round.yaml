# Clive on the round screen: a voice satellite for the Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C
# (sold by The Pi Hut as "ESP32-P4 3.4" Round Touch Display Dev Board (800x800)", Waveshare SKU 31523).
#
# It listens for the wake word, sends the speech to Home Assistant's Assist (Clive, the Claude agent), speaks the answer,
# and draws Clive's design on the round screen: four designs (Glance, Clock, Weather, Ring), the glow while he works, cards
# when an answer needs a graphic, quick settings (swipe down from the top) and pairing. The look is in docs/CLIVE-STYLE.md;
# the screen itself is in ui.yaml (generated by tools/gen_ui.py) and clive_ui.h, shared with sim.yaml (a desktop simulator).
#
# Pins come from Waveshare's own examples and schematic (github.com/waveshareteam/ESP32-P4-WIFI6-Touch-LCD-XC):
# I2C 7/8, I2S 13/12/10/9/11, speaker amp 53, LCD reset 27, backlight 26 (PWM) and 33 (enable), touch reset 23, Wi-Fi
# co-processor on SDIO 14-19/54. The touch interrupt pin is not published, so it is left out and the address is 0x5D.
#
# STATUS: compiles. NOT yet flashed to a board: touch address, chip revision, audio levels and the glow's frame rate are
# untested. See satellite/README.md "Check on first boot".

substitutions:
  name: clive-round
  friendly_name: Clive (round screen)
  wake_model: hey_jarvis       # The apps already strip "Jarvis" from a sentence. A custom "Clive" model can replace it.

packages:
  ui: !include ui.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: ui_bind
      - lambda: |-
          clive::device_name = "${name}";
      - switch.turn_on: lcd_backlight_enable
      - switch.turn_on: speaker_amp
      - script.execute: apply_backlight
      - micro_wake_word.start:
      # With no Wi-Fi yet (a new or reset satellite) the pair screen opens by itself, so the QR code is the first thing on the glass.
      - delay: 20s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - lambda: clive::show_pair();

esp32:
  board: esp32-p4-evboard
  # The chip has 32MB, but ESPHome only allows over-the-air updates up to 16MB without an experimental flag. 16MB is plenty.
  flash_size: 16MB
  variant: esp32p4
  # CHECK: the board's chip is an ESP32-P4NRW32 (silicon v3.x per Waveshare's README). If it will not boot or the log
  # complains about the chip revision, set engineering_sample: true here.
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

logger:

api:
  encryption:
    key: !secret clive_round_api_key
  actions:
    # Called by satellite/ha/clive-satellite-info.yaml: the numbers the resting screen shows.
    - action: update_info
      variables:
        outside: string
        cond: string
        high: string
        low: string
        inside: string
        g_home: string
        g_energy: string
        g_car: string
        g_alarm: string
        g_heat: string
        g_air: string
      then:
        - script.execute:
            id: ui_update_info
            outside: !lambda return outside;
            cond: !lambda return cond;
            high: !lambda return high;
            low: !lambda return low;
            inside: !lambda return inside;
            g_home: !lambda return g_home;
            g_energy: !lambda return g_energy;
            g_car: !lambda return g_car;
            g_alarm: !lambda return g_alarm;
            g_heat: !lambda return g_heat;
            g_air: !lambda return g_air;
    # Called by satellite/ha/clive-satellite-show.yaml when Clive's answer needs a graphic.
    - action: show_card
      variables:
        icon: string
        big: string
        title: string
        sub: string
        r1: string
        r2: string
        r3: string
        percent: int
        ask: bool
        pal: string
        seconds: int
      then:
        - script.execute:
            id: ui_show_card
            icon: !lambda return icon;
            big: !lambda return big;
            title: !lambda return title;
            sub: !lambda return sub;
            r1: !lambda return r1;
            r2: !lambda return r2;
            r3: !lambda return r3;
            percent: !lambda return percent;
            ask: !lambda return ask;
            pal: !lambda return pal;
            seconds: !lambda return seconds;
    - action: hide_card
      then:
        - script.execute: ui_hide_card

ota:
  - platform: esphome

# No Wi-Fi is built in: the companion app sends it over Bluetooth (improv_ble below, see docs/SATELLITE-PAIRING.md), and the device remembers it.
# For bench work you can add `ssid` and `password` here (from secrets.yaml); a built-in network is tried first.
wifi:
  ap:
    ssid: "${friendly_name} setup"

captive_portal:

# Bluetooth goes through the ESP32-C6 as well. The Wi-Fi hand-over only works while the pair screen is showing (Settings > Pair or reset,
# or by itself when there is no Wi-Fi yet), so the authorizer is the pair screen.
esp32_ble:
  io_capability: none

improv_ble:
  authorizer: pair_authorized
  authorized_duration: 2min

binary_sensor:
  - platform: template
    id: pair_authorized
    internal: true
    lambda: 'return clive::pairing_open();'

# The P4 has no Wi-Fi of its own: the ESP32-C6 on the board provides it over SDIO.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  slot: 1

time:
  - platform: homeassistant
    id: clock_time

i2c:
  sda: GPIO7
  scl: GPIO8
  scan: true

# ---------------------------------------------------------------- audio

switch:
  - platform: gpio
    id: speaker_amp            # The speaker amplifier is on when GPIO53 is high.
    pin: GPIO53
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: lcd_backlight_enable
    pin: GPIO33
    restore_mode: ALWAYS_ON
  # Quick-settings switches, also shown in Home Assistant.
  - platform: template
    name: "Microphone"
    id: mic_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - micro_wake_word.start:
    turn_off_action:
      - micro_wake_word.stop:
      - voice_assistant.stop:
  - platform: template
    name: "Spoken answers"
    id: spoken_answers
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: "Follow-up listening"
    id: follow_up
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: "Night mode"
    id: night_forced
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - script.execute: apply_backlight
    turn_off_action:
      - script.execute: apply_backlight

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    # CHECK: the onboard microphones feed the ES7210. If the level is too low or too high, change mic_gain.
    mic_gain: 24db

i2s_audio:
  - id: i2s_main
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_main
    i2s_din_pin: GPIO11
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_main
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 100ms

micro_wake_word:
  id: mww
  microphone: board_mic
  models:
    - model: ${wake_model}
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: board_mic
  speaker: board_speaker
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - script.execute: {id: ui_set_state, state: 1}
  on_stt_vad_end:
    - script.execute: {id: ui_set_state, state: 2}
  on_tts_start:
    - script.execute: {id: ui_set_state, state: 3}
  on_end:
    # The answer has been spoken: back to the resting screen (a card stays until its own timer ends).
    - wait_until:
        not:
          speaker.is_playing: board_speaker
    - script.execute: {id: ui_set_state, state: 0}
    - if:
        condition:
          switch.is_on: mic_enabled
        then:
          - micro_wake_word.start:
  on_error:
    - script.execute: {id: ui_set_state, state: 0}
    - if:
        condition:
          switch.is_on: mic_enabled
        then:
          - micro_wake_word.start:
  on_idle:
    - script.execute: {id: ui_set_state, state: 0}

# ---------------------------------------------------------------- what the touch screen asks of the hardware

script:
  - id: ui_hook_talk                 # a tap on Clive's dock
    then:
      - if:
          condition:
            and:
              - switch.is_on: mic_enabled
              - not:
                  voice_assistant.is_running:
          then:
            - micro_wake_word.stop:
            - voice_assistant.start:
  - id: ui_hook_answer               # Yes / No on a card that asked a question
    parameters:
      accepted: bool
    then:
      - homeassistant.event:
          event: esphome.${name}_answer
          data:
            answer: !lambda 'return accepted ? "yes" : "no";'
  - id: ui_hook_tile                 # the quick-settings switches: 0 mic, 1 spoken, 2 follow-up, 3 night, 4 clean, 5 Wi-Fi
    parameters:
      key: int
      checked: bool
    then:
      - lambda: |-
          switch (key) {
            case 0: if (checked) id(mic_enabled).turn_on(); else id(mic_enabled).turn_off(); break;
            case 1: if (checked) id(spoken_answers).turn_on(); else id(spoken_answers).turn_off(); break;
            case 2: if (checked) id(follow_up).turn_on(); else id(follow_up).turn_off(); break;
            case 3: if (checked) id(night_forced).turn_on(); else id(night_forced).turn_off(); break;
            default: break;
          }
      - if:
          condition:
            lambda: 'return key == 4 && checked;'
          then:
            # Clean screen: ignore touch for 30 seconds so it can be wiped.
            - lvgl.pause:
            - delay: 30s
            - lvgl.resume:
  - id: ui_hook_slider               # 0 volume, 1 brightness
    parameters:
      which: int
      value: float
    then:
      - if:
          condition:
            lambda: 'return which == 0;'
          then:
            - number.set:
                id: speaker_volume
                value: !lambda 'return value;'
          else:
            - lambda: |-
                id(backlight_day).publish_state(value < 8 ? 8 : value);
            - script.execute: apply_backlight
  - id: apply_backlight              # day or night brightness, from the numbers below
    then:
      - lambda: |-
          auto t = id(clock_time).now();
          int hour = t.is_valid() ? t.hour : 12;
          int s = (int) id(night_start).state, e = (int) id(night_end).state;
          bool night = id(night_forced).state || (s > e ? (hour >= s || hour < e) : (hour >= s && hour < e));
          float pct = night ? id(backlight_night).state : id(backlight_day).state;
          auto call = id(backlight).make_call();
          call.set_state(true);
          call.set_brightness(pct / 100.0f);
          call.perform();

interval:
  - interval: 60s
    then:
      - script.execute: apply_backlight

number:
  - platform: template
    name: "Backlight day"
    id: backlight_day
    min_value: 8
    max_value: 100
    step: 1
    initial_value: 90
    restore_value: true
    optimistic: true
    entity_category: config
    unit_of_measurement: "%"
    on_value:
      - script.execute: apply_backlight
  - platform: template
    name: "Backlight night"
    id: backlight_night
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 12
    restore_value: true
    optimistic: true
    entity_category: config
    unit_of_measurement: "%"
    on_value:
      - script.execute: apply_backlight
  - platform: template
    name: "Night starts (hour)"
    id: night_start
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 22
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Night ends (hour)"
    id: night_end
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 6
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    name: "Volume"
    id: speaker_volume
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 70
    restore_value: true
    optimistic: true
    entity_category: config
    unit_of_measurement: "%"
    on_value:
      - speaker.volume_set:
          id: board_speaker
          volume: !lambda 'return x / 100.0f;'

# Buttons for the companion app (and Home Assistant): each is one tap, no state.
button:
  - platform: factory_reset
    name: "Reset pairing"       # Forgets the Wi-Fi so the satellite can be paired again. Its settings reset too.
    entity_category: config
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: template
    name: "Identify"            # Pulses the screen so you can tell which satellite this is.
    entity_category: diagnostic
    on_press:
      - repeat:
          count: 3
          then:
            - light.turn_on: {id: backlight, brightness: 100%}
            - delay: 250ms
            - light.turn_on: {id: backlight, brightness: 5%}
            - delay: 250ms
      - script.execute: apply_backlight
  - platform: template
    name: "Clean screen"        # Ignores the touch for 30 seconds so the glass can be wiped.
    entity_category: config
    on_press:
      - lvgl.pause:
      - delay: 30s
      - lvgl.resume:

# ---------------------------------------------------------------- screen

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO26
    frequency: 1220Hz

light:
  - platform: monochromatic
    id: backlight
    name: Screen brightness
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_dsi
    id: round_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-3.4C
    reset_pin: GPIO27
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: round_touch
    display: round_display
    reset_pin: GPIO23
    # CHECK: no interrupt pin is given, so the chip may answer on 0x14 instead. If the log shows
    # "touch not found", change this to 0x14.
    address: 0x5D

lvgl:
  displays:
    - round_display
  touchscreens:
    - round_touch

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP address
      entity_category: diagnostic
    ssid:
      name: Wi-Fi network
      entity_category: diagnostic
  - platform: version
    name: ESPHome version
    entity_category: diagnostic
