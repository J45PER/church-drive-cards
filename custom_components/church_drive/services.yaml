sync_scenes:
schedule_action:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    action:
      required: true
      selector:
        select:
          options: ["on", "off", "open", "close", "set"]
    value:
      selector:
        number:
          min: 0
          max: 100
          mode: box
    name:
      selector:
        text:
    at:
      example: "2026-11-21 08:15"
      selector:
        text:
    time:
      example: "07:00"
      selector:
        text:
    days:
      example: "mon, tue, wed, thu, fri"
      selector:
        text:
list_schedules:
cancel_schedule:
  fields:
    which:
      required: true
      selector:
        text:
    all:
      selector:
        boolean:
apply_gradient:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    colours:
      required: true
      example: '["#3ec6ff", "#5b8cfd", "#b36bff"]'
      selector:
        object:
set_fitting:
  fields:
    room:
      required: true
      selector:
        entity:
          domain: light
    main:
      example: '{"on": true, "mode": "white", "kelvin": 2700, "brightness": 60}'
      selector:
        object:
    ring:
      example: '{"on": true, "rgb": [0, 60, 255]}'
      selector:
        object:
    keep_ring:
      selector:
        boolean:
apply_hybrid:
  fields:
    id:
      required: true
      example: movie
      selector:
        text:
apply_scene:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    scene:
      required: true
      example: Bright
      selector:
        select:
          custom_value: true
          options:
            - Bright
            - Cool bright
            - Dimmed
            - Read
            - Concentrate
            - Energise
            - Relax
            - Rest
            - Nightlight
media_control:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    action:
      required: true
      example: pause
      selector:
        select:
          options: [play, pause, play_pause, stop, next, previous, turn_on, turn_off, volume_up, volume_down, volume_set, mute, unmute, select_source]
    value:
      example: "35"
      selector:
        text:
media_status:
apply_proposal:
  fields:
    id:
      required: true
      example: 1a2b3c4d5e
      selector:
        text:
decline_proposal:
  fields:
    id:
      required: true
      example: 1a2b3c4d5e
      selector:
        text:
    reason:
      example: The text on it would be too faint to read
      selector:
        text:
sync_firestore:
set_palette:
  fields:
    key:
      required: true
      example: lights
      selector:
        text:
    name:
      selector:
        text:
    colours:
      required: true
      example: '["#FFC857", "#4E4128", "#D5A190", "#FFE4AB", "#6E572D"]'
      selector:
        object:
set_assistant_data:
  fields:
    heard:
      example: '{"hailey": "Hayley"}'
      selector:
        object:
    motions:
      selector:
        object:
    reset:
      selector:
        boolean:
log_logo_request:
  fields:
    competition:
      selector:
        text:
    sport:
      selector:
        text:
health_fix:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
    action:
      default: resync
      selector:
        select:
          options:
            - refresh
            - resync
            - nudge
            - reconnect
notify:
  fields:
    kind:
      example: doorbell
      selector:
        text:
    people:
      example: Jamie
      selector:
        text:
          multiple: true
    title:
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    admin_message:
      selector:
        text:
    tag:
      selector:
        text:
    link:
      example: /dashboard-mobile/todo
      selector:
        text:
    image:
      selector:
        text:
    critical:
      selector:
        boolean:
    data:
      selector:
        object:
    task_list:
      example: todo.priorities_jamie
      selector:
        entity:
          domain: todo
    task_uid:
      selector:
        text:
add_tasks:
  fields:
    text:
      required: true
      example: "Can you pick up milk and book the dentist before Friday?"
      selector:
        text:
          multiline: true
    person:
      example: Jamie
      selector:
        text:
    source:
      example: WhatsApp
      selector:
        text:
    auto_add:
      default: false
      selector:
        boolean:
    ai_task_entity:
      selector:
        entity:
          domain: ai_task
shopping_add:
  fields:
    items:
      required: true
      example: "milk, eggs"
      selector:
        object:
    list:
      selector:
        text:
    person:
      example: Jamie
      selector:
        text:
    name:
      example: Weekly shop
      selector:
        text:
    date:
      selector:
        date:

steps_create:
  fields:
    name:
      required: true
      example: Set up Ring Talk
      selector:
        text:
    steps:
      required: true
      example: "Check the Hub, Reserve the address"
      selector:
        object:
    people:
      example: Jamie
      selector:
        object:
    date:
      selector:
        date:
    time:
      selector:
        time:
    at_home:
      default: false
      selector:
        boolean:
