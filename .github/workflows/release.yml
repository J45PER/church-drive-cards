name: Release

# Publishes a GitHub release (tag vX.Y.Z) whenever main carries a package.json
# version that hasn't been released yet. To release: bump "version" in
# package.json, run `npm run build` (it syncs the integration manifest) and
# merge. HACS offers each release of the Church Drive integration as an update
# in Home Assistant; the cards bundle ships inside custom_components/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.exists == 'false'
        run: npm ci && npm run build
      - name: Committed bundle matches fresh build
        if: steps.version.outputs.exists == 'false'
        run: git diff --exit-code -- custom_components church-drive-cards-beta.js
      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" custom_components/church_drive/frontend/church-drive-cards.js --target "$GITHUB_SHA" --title "$TAG" --generate-notes
