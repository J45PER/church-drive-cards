name: Companion Android

on:
  push:
    branches: [companion-apps]
    paths: ["companion/android/**", ".github/workflows/companion-android.yml"]
  pull_request:
    paths: ["companion/android/**", ".github/workflows/companion-android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: church-drive-debug-apk
          path: companion/android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a pre-release
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls companion/android/app/build/outputs/apk/debug/*.apk)
          cp "$apk" church-drive.apk
          gh release delete companion-android-latest --yes --cleanup-tag || true
          gh release create companion-android-latest church-drive.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Church Drive Android (test build)" \
            --notes "Latest test build from the companion-apps branch (commit ${GITHUB_SHA::7}). Download church-drive.apk on an Android phone and install it."
