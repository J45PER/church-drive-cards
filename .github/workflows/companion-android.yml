name: Companion Android

on:
  push:
    branches: [companion-apps, main]
    paths: ["companion/android/**", ".github/workflows/companion-android.yml"]
  pull_request:
    paths: ["companion/android/**", ".github/workflows/companion-android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Google push: the Firebase project's google-services.json comes from a repository secret (GOOGLE_SERVICES_JSON); without it the app is built without Google push.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      # The build's errors are also shown as an annotation (the run's log is not always readable from outside GitHub).
      - name: Build and test
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug --console=plain 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not resolve|AAPT|Manifest merger" -A2 ../build.log | head -80 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: church-drive-debug-apk
          path: companion/android/app/build/outputs/apk/debug/*.apk
      # The Wear OS app (same application id as the phone app: one Play listing) and the to-do-only app.
      - uses: actions/upload-artifact@v4
        with:
          name: church-drive-wear-debug-apk
          path: companion/android/wear/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: church-drive-todo-debug-apk
          path: companion/android/todo/build/outputs/apk/debug/*.apk
      # The phone app (with the watch app) and Church Drive To-Do have separate versions and separate releases, so a change to one does not
      # show up as a release of the other. Work out which a push touched: anything in `core` or the build files is both's.
      - name: Which apps changed
        id: changed
        if: github.event_name == 'push'
        working-directory: .
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            files=$(git ls-files companion/android .github/workflows/companion-android.yml)
          else
            files=$(git diff --name-only "$before" "$GITHUB_SHA")
          fi
          main=false; todo=false
          while read -r f; do
            case "$f" in
              companion/android/todo/*) todo=true ;;
              companion/android/*) main=true; case "$f" in companion/android/core/*|companion/android/*.kts|companion/android/gradle*|companion/android/gradle/*) todo=true ;; esac ;;
              .github/workflows/companion-android.yml) main=true; todo=true ;;
            esac
          done <<< "$files"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "Phone and watch apps changed: $main. To-Do app changed: $todo."
      - name: Publish the phone and watch apps
        if: github.event_name == 'push' && steps.changed.outputs.main == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' companion/android/version.properties)
          cp "$(ls companion/android/app/build/outputs/apk/debug/*.apk)" church-drive.apk
          cp "$(ls companion/android/wear/build/outputs/apk/debug/*.apk)" church-drive-wear.apk
          # The latest test build: replaced on every push that touches these apps (the app looks here for updates).
          gh release delete companion-android-latest --yes --cleanup-tag || true
          gh release create companion-android-latest church-drive.apk church-drive-wear.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Church Drive Android ${version} (test build ${GITHUB_RUN_NUMBER})" \
            --notes "Latest test build, version ${version}, build ${GITHUB_RUN_NUMBER}, from the ${GITHUB_REF_NAME} branch (commit ${GITHUB_SHA::7}). Download church-drive.apk on an Android phone and install it (church-drive-wear.apk is the Wear OS watch app). Church Drive To-Do has its own releases."
          # The app looks for updates through the public releases API, which cannot see a draft: make sure this one is published.
          gh release edit companion-android-latest --draft=false --prerelease
          gh release view companion-android-latest --json isDraft,isPrerelease,tagName
          # Each version keeps its own release, made the first time a build has that version: a permanent record of what shipped.
          if ! gh release view "android-v${version}" >/dev/null 2>&1; then
            notes=$(awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' companion/android/CHANGELOG.md)
            gh release create "android-v${version}" church-drive.apk church-drive-wear.apk \
              --target "$GITHUB_SHA" \
              --title "Church Drive Android ${version}" \
              --notes "${notes:-Version ${version}.} (Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}.)"
          fi
      - name: Publish Church Drive To-Do
        if: github.event_name == 'push' && steps.changed.outputs.todo == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' companion/android/todo/version.properties)
          cp "$(ls companion/android/todo/build/outputs/apk/debug/*.apk)" church-drive-todo.apk
          gh release delete todo-latest --yes --cleanup-tag || true
          gh release create todo-latest church-drive-todo.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Church Drive To-Do ${version} (test build ${GITHUB_RUN_NUMBER})" \
            --notes "Latest test build of Church Drive To-Do, version ${version}, build ${GITHUB_RUN_NUMBER}, from the ${GITHUB_REF_NAME} branch (commit ${GITHUB_SHA::7}). Download church-drive-todo.apk on an Android phone and install it."
          gh release edit todo-latest --draft=false --prerelease --latest=false
          if ! gh release view "todo-v${version}" >/dev/null 2>&1; then
            notes=$(awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' companion/android/todo/CHANGELOG.md)
            gh release create "todo-v${version}" church-drive-todo.apk --latest=false \
              --target "$GITHUB_SHA" \
              --title "Church Drive To-Do ${version}" \
              --notes "${notes:-Version ${version}.} (Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}.)"
          fi
