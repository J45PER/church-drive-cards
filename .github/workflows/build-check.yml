name: Build check

# Fails if the committed bundles (or the manifest version) don't match a fresh
# build of src/, i.e. someone edited src/ or package.json and forgot to run
# `npm run build` (or edited a bundle by hand). It never commits anything.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed bundle matches fresh build
        run: |
          if ! git diff --exit-code -- custom_components church-drive-cards-beta.js; then
            echo "::error::Build output is out of date. Run 'npm run build' and commit the changes."
            exit 1
          fi
