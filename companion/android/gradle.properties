# The release bundle (five modules and the dex merge) ran out of heap at 2g on the CI runner twice in a day (2026-11-22), so the build gets more.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
kotlin.code.style=official
